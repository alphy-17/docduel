[project]
name = "docduel"
version = "0.1.0"
description = "DocDuel backend: fine-tuned small model vs OpenAI on documents"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docduel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external services (opt-in)"]

[dependency-groups]
data = [
    "huggingface-hub>=2.0.0",
    "pyarrow>=25.0.1",
]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
